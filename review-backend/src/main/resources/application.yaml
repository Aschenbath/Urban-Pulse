server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:review_platform}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6380}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s

  jackson:
    default-property-inclusion: non_null
  main:
    banner-mode: off

urban-pulse:
  demo:
    # 无短信通道的演示环境：把生成的验证码随 /user/code 响应返回，前端自动回填输入框。
    # 生产环境接入真实短信服务商后设为 false。
    expose-login-code: ${DEMO_EXPOSE_LOGIN_CODE:true}

mybatis-plus:
  type-aliases-package: com.aschen.redis.entity
  global-config:
    banner: off
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.aschen.redis.mapper: debug
